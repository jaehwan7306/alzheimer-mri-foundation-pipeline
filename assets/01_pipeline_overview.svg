<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .head { font: 700 24px Arial, sans-serif; fill: #111827; }
      .sub { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .accent { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 18; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="600" y="55" text-anchor="middle" class="title">Alzheimer MRI Multi-Foundation Screening Pipeline</text>

  <rect x="420" y="95" width="360" height="88" class="accent"/>
  <text x="600" y="130" text-anchor="middle" class="head">Alzheimer MRI</text>
  <text x="600" y="158" text-anchor="middle" class="sub">Patient MRI slices</text>

  <path d="M600 183 L600 225 L320 225 L320 260" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M600 225 L880 225 L880 260" class="arrow" marker-end="url(#arrowhead)"/>

  <rect x="120" y="265" width="400" height="130" class="box"/>
  <text x="320" y="312" text-anchor="middle" class="head">BiomedCLIP</text>
  <text x="320" y="348" text-anchor="middle" class="sub">Screening</text>
  <text x="320" y="377" text-anchor="middle" class="sub">Frozen encoder + adapter probe</text>

  <rect x="680" y="265" width="400" height="130" class="box"/>
  <text x="880" y="312" text-anchor="middle" class="head">SAM + Occlusion</text>
  <text x="880" y="348" text-anchor="middle" class="sub">Brain Region Context</text>
  <text x="880" y="377" text-anchor="middle" class="sub">Visual evidence generation</text>

  <path d="M320 395 L320 470" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="320" y="445" text-anchor="middle" class="head">Risk Score</text>

  <path d="M880 395 L880 500 L600 500 L600 545" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M320 470 L320 500 L600 500" class="arrow"/>

  <rect x="390" y="550" width="420" height="100" class="accent"/>
  <text x="600" y="590" text-anchor="middle" class="head">Structured Screening Output</text>
  <text x="600" y="620" text-anchor="middle" class="sub">Prediction + visual evidence</text>

  <path d="M600 650 L600 710" class="arrow" marker-end="url(#arrowhead)"/>

  <rect x="390" y="715" width="420" height="105" class="box"/>
  <text x="600" y="755" text-anchor="middle" class="head">Local LLM</text>
  <text x="600" y="790" text-anchor="middle" class="sub">Report Generation</text>

  <path d="M600 820 L600 875" class="arrow" marker-end="url(#arrowhead)"/>

  <rect x="390" y="880" width="420" height="80" class="accent"/>
  <text x="600" y="930" text-anchor="middle" class="head">Final Screening Report</text>
</svg>