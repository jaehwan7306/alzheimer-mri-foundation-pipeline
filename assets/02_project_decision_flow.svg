<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">Project Decision Flow</title>
  <desc id="desc">Seven research decisions from reliable patient-level evaluation through binary screening, sensitivity-first model selection, lightweight foundation-model adaptation, a deferred internal-adapter validation, and the final multi-foundation pipeline.</desc>
  <defs>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #1F2937; }
      .subtitle { font: 18px Arial, sans-serif; fill: #6B7280; }
      .step { font: 700 14px Arial, sans-serif; fill: #64748B; letter-spacing: 1px; }
      .card-title { font: 700 22px Arial, sans-serif; fill: #1F2937; }
      .body { font: 16px Arial, sans-serif; fill: #4B5563; }
      .key { font: 700 16px Arial, sans-serif; fill: #1D4ED8; }
      .warn { font: 700 16px Arial, sans-serif; fill: #B45309; }
      .final { font: 700 16px Arial, sans-serif; fill: #047857; }
      .principle-title { font: 700 18px Arial, sans-serif; fill: #374151; }
      .principle { font: 16px Arial, sans-serif; fill: #4B5563; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1400" height="1040" fill="#FFFFFF"/>
  <text x="700" y="58" text-anchor="middle" class="title">Project Decision Flow</text>
  <text x="700" y="91" text-anchor="middle" class="subtitle">The final pipeline reflects evaluation reliability, screening goals, project scope, and limited experiment time.</text>

  <!-- Row 1 -->
  <rect x="70" y="135" width="380" height="205" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="100" y="170" class="step">STEP 01</text>
  <text x="100" y="208" class="card-title">Foundation-Model Starting Point</text>
  <text x="100" y="245" class="body">Use BiomedCLIP as a pretrained</text>
  <text x="100" y="271" class="body">biomedical representation rather than</text>
  <text x="100" y="297" class="key">building only a task-specific CNN.</text>

  <rect x="510" y="135" width="380" height="205" rx="22" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="540" y="170" class="step">STEP 02</text>
  <text x="540" y="208" class="card-title">Fix Evaluation Reliability</text>
  <text x="540" y="245" class="body">Image-level splitting can place slices</text>
  <text x="540" y="271" class="body">from the same patient in train and test.</text>
  <text x="540" y="303" class="key">→ switch to patient-level evaluation</text>

  <rect x="950" y="135" width="380" height="205" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="980" y="170" class="step">STEP 03</text>
  <text x="980" y="208" class="card-title">Redefine the Research Task</text>
  <text x="980" y="245" class="body">Severity grading was deprioritized:</text>
  <text x="980" y="271" class="body">the project focuses on early screening.</text>
  <text x="980" y="303" class="key">→ NonDemented vs Demented</text>

  <line x1="450" y1="238" x2="502" y2="238" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="238" x2="942" y2="238" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="950" y="420" width="380" height="205" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="980" y="455" class="step">STEP 04</text>
  <text x="980" y="493" class="card-title">Sensitivity-First Screening</text>
  <text x="980" y="530" class="body">Choose thresholds on validation patients</text>
  <text x="980" y="556" class="body">with missed positives as the main concern.</text>
  <text x="980" y="588" class="key">→ prioritize sensitivity over accuracy</text>

  <rect x="510" y="420" width="380" height="205" rx="22" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="540" y="455" class="step">STEP 05</text>
  <text x="540" y="493" class="card-title">Keep Adaptation Lightweight</text>
  <text x="540" y="530" class="body">Zero-shot → linear probe → adapter probe,</text>
  <text x="540" y="556" class="body">then LoRA / internal-adapter pilots.</text>
  <text x="540" y="588" class="key">→ preserve pretrained representation</text>

  <rect x="70" y="420" width="380" height="205" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="100" y="455" class="step">STEP 06</text>
  <text x="100" y="493" class="card-title">Scope Cut, Not Negative Result</text>
  <text x="100" y="530" class="body">Internal Adapter Fold 1 was promising,</text>
  <text x="100" y="556" class="body">but 5-fold validation was not completed.</text>
  <text x="100" y="588" class="warn">→ deferred because of project time</text>

  <path d="M1140 340 L1140 412" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="950" y1="523" x2="898" y2="523" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="510" y1="523" x2="458" y2="523" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Final row -->
  <rect x="390" y="705" width="620" height="190" rx="24" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
  <text x="425" y="742" class="step">STEP 07</text>
  <text x="425" y="782" class="card-title">Prioritize the Multi-Foundation System</text>
  <text x="425" y="820" class="body">Use the fully evaluated adapter probe as the practical classifier,</text>
  <text x="425" y="847" class="body">then spend remaining effort on complementary model integration.</text>
  <text x="425" y="878" class="final">BiomedCLIP + SAM + Occlusion + Local LLM</text>

  <path d="M260 625 L260 655 L700 655 L700 697" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="145" y="940" width="1110" height="70" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="180" y="970" class="principle-title">Decision principle</text>
  <text x="345" y="970" class="principle">Trustworthy patient-level evaluation first; then choose a sufficiently strong, efficient classifier.</text>
  <text x="345" y="994" class="principle">Further classifier optimization was secondary to completing the multi-foundation screening pipeline.</text>
</svg>