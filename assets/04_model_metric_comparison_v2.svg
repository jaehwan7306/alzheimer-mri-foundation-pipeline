<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #4b5563; }
      .header { font: 700 17px Arial, sans-serif; fill: #1f2937; }
      .cell { font: 500 16px Arial, sans-serif; fill: #374151; }
      .model { font: 700 16px Arial, sans-serif; fill: #111827; }
      .selected { font: 700 16px Arial, sans-serif; fill: #b91c1c; }
      .note { font: 500 15px Arial, sans-serif; fill: #4b5563; }
      .selected-note { font: 700 19px Arial, sans-serif; fill: #b91c1c; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="750" y="52" text-anchor="middle" class="title">Model Performance Comparison</text>
  <text x="750" y="82" text-anchor="middle" class="subtitle">Patient-level evaluation metrics</text>

  <!-- Header -->
  <rect x="55" y="120" width="1390" height="58" rx="10" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="170" y="155" text-anchor="middle" class="header">Model</text>
  <text x="420" y="155" text-anchor="middle" class="header">Sensitivity</text>
  <text x="560" y="155" text-anchor="middle" class="header">Specificity</text>
  <text x="700" y="155" text-anchor="middle" class="header">Precision</text>
  <text x="820" y="155" text-anchor="middle" class="header">F1</text>
  <text x="940" y="155" text-anchor="middle" class="header">Macro F1</text>
  <text x="1070" y="155" text-anchor="middle" class="header">AUROC</text>
  <text x="1200" y="155" text-anchor="middle" class="header">AUPRC</text>
  <text x="1355" y="155" text-anchor="middle" class="header">Folds</text>

  <!-- Row 1 -->
  <rect x="55" y="185" width="1390" height="68" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="170" y="213" text-anchor="middle" class="model"><tspan x="170">BiomedCLIP</tspan><tspan x="170" dy="20">Zero-shot</tspan></text>
  <text x="420" y="226" text-anchor="middle" class="cell">0.223</text>
  <text x="560" y="226" text-anchor="middle" class="cell">0.778</text>
  <text x="700" y="226" text-anchor="middle" class="cell">0.231</text>
  <text x="820" y="226" text-anchor="middle" class="cell">0.226</text>
  <text x="940" y="226" text-anchor="middle" class="cell">0.499</text>
  <text x="1070" y="226" text-anchor="middle" class="cell">0.486</text>
  <text x="1200" y="226" text-anchor="middle" class="cell">0.268</text>
  <text x="1355" y="226" text-anchor="middle" class="cell">5</text>

  <!-- Row 2 -->
  <rect x="55" y="258" width="1390" height="68" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="170" y="286" text-anchor="middle" class="model"><tspan x="170">BiomedCLIP</tspan><tspan x="170" dy="20">Linear Probe</tspan></text>
  <text x="420" y="299" text-anchor="middle" class="cell">0.839</text>
  <text x="560" y="299" text-anchor="middle" class="cell">0.790</text>
  <text x="700" y="299" text-anchor="middle" class="cell">0.550</text>
  <text x="820" y="299" text-anchor="middle" class="cell">0.662</text>
  <text x="940" y="299" text-anchor="middle" class="cell">0.761</text>
  <text x="1070" y="299" text-anchor="middle" class="cell">0.898</text>
  <text x="1200" y="299" text-anchor="middle" class="cell">0.687</text>
  <text x="1355" y="299" text-anchor="middle" class="cell">5</text>

  <!-- Selected row -->
  <rect x="48" y="331" width="1404" height="82" rx="10" fill="#ffd6d6" stroke="#dc2626" stroke-width="4"/>
  <text x="170" y="361" text-anchor="middle" class="selected"><tspan x="170">BiomedCLIP</tspan><tspan x="170" dy="21">Adapter Probe</tspan></text>
  <text x="420" y="379" text-anchor="middle" class="selected">0.888</text>
  <text x="560" y="379" text-anchor="middle" class="selected">0.823</text>
  <text x="700" y="379" text-anchor="middle" class="selected">0.604</text>
  <text x="820" y="379" text-anchor="middle" class="selected">0.718</text>
  <text x="940" y="379" text-anchor="middle" class="selected">0.802</text>
