  <text x="1200" y="379" text-anchor="middle" class="selected">0.695</text>
  <text x="1355" y="379" text-anchor="middle" class="selected">5</text>

  <!-- Row 4 -->
  <rect x="55" y="420" width="1390" height="68" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="170" y="448" text-anchor="middle" class="model"><tspan x="170">BiomedCLIP</tspan><tspan x="170" dy="20">LoRA</tspan></text>
  <text x="420" y="461" text-anchor="middle" class="cell">0.814</text>
  <text x="560" y="461" text-anchor="middle" class="cell">0.827</text>
  <text x="700" y="461" text-anchor="middle" class="cell">0.592</text>
  <text x="820" y="461" text-anchor="middle" class="cell">0.676</text>
  <text x="940" y="461" text-anchor="middle" class="cell">0.777</text>
  <text x="1070" y="461" text-anchor="middle" class="cell">0.896</text>
  <text x="1200" y="461" text-anchor="middle" class="cell">0.673</text>
  <text x="1355" y="461" text-anchor="middle" class="cell">5</text>

  <!-- Row 5 -->
  <rect x="55" y="493" width="1390" height="68" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="170" y="521" text-anchor="middle" class="model"><tspan x="170">BiomedCLIP</tspan><tspan x="170" dy="20">Internal Adapter*</tspan></text>
  <text x="420" y="534" text-anchor="middle" class="cell">0.938</text>
  <text x="560" y="534" text-anchor="middle" class="cell">0.778</text>
  <text x="700" y="534" text-anchor="middle" class="cell">0.556</text>
  <text x="820" y="534" text-anchor="middle" class="cell">0.698</text>
  <text x="940" y="534" text-anchor="middle" class="cell">0.782</text>
  <text x="1070" y="534" text-anchor="middle" class="cell">0.902</text>
  <text x="1200" y="534" text-anchor="middle" class="cell">0.642</text>
  <text x="1355" y="534" text-anchor="middle" class="cell">1</text>

  <!-- Row 6 -->
  <rect x="55" y="566" width="1390" height="68" rx="8" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="170" y="594" text-anchor="middle" class="model"><tspan x="170">EfficientNet</tspan><tspan x="170" dy="20">CNN Baseline</tspan></text>
  <text x="420" y="607" text-anchor="middle" class="cell">0.776</text>
  <text x="560" y="607" text-anchor="middle" class="cell">0.857</text>
  <text x="700" y="607" text-anchor="middle" class="cell">0.627</text>
  <text x="820" y="607" text-anchor="middle" class="cell">0.690</text>
  <text x="940" y="607" text-anchor="middle" class="cell">0.790</text>
  <text x="1070" y="607" text-anchor="middle" class="cell">0.912</text>
  <text x="1200" y="607" text-anchor="middle" class="cell">0.734</text>
  <text x="1355" y="607" text-anchor="middle" class="cell">5</text>

  <rect x="55" y="658" width="650" height="48" rx="10" fill="#ffd6d6" stroke="#dc2626" stroke-width="2"/>
  <text x="75" y="689" class="selected-note">FINAL SELECTED CLASSIFIER — BiomedCLIP Adapter Probe</text>

  <text x="55" y="735" class="note">Selected for sensitivity-first screening and parameter-efficient foundation-model adaptation. EfficientNet remains stronger on AUROC/AUPRC. *Internal Adapter: Fold 1 only.</text>
</svg>