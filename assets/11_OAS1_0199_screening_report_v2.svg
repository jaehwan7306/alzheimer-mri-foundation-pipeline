<text x="1130" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">0.1734</text>
<rect x="90" y="465" width="1220" height="130" rx="18" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="120" y="510" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2937">Interpretation</text>
<text x="120" y="548" font-family="Arial, sans-serif" font-size="19" fill="#374151">The patient-level score is close to the screening threshold, while the representative slice</text>
<text x="120" y="579" font-family="Arial, sans-serif" font-size="19" fill="#374151">shows stronger positive evidence. Occlusion highlights model-sensitive regions, not clinical ROIs.</text>
<rect x="90" y="630" width="1220" height="78" rx="16" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="120" y="678" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#B91C1C">Research screening output only — not a medical diagnosis.</text>
