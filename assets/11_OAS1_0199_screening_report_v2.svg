<line x1="745" y1="222" x2="1310" y2="222" stroke="#E5E7EB" stroke-width="2"/>
<text x="745" y="270" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">Representative slice P(Demented)</text>
<text x="1130" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">0.945</text>
