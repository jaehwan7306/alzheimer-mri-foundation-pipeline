<text x="90" y="270" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">Experimental label</text>
<text x="410" y="270" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">NonDemented</text>
