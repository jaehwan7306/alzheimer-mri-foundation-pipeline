<text x="90" y="360" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">Patient-level P(Demented)</text>
<text x="410" y="360" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">0.4215</text>
<text x="90" y="405" font-family="Arial, sans-serif" font-size="20" fill="#6B7280">Threshold</text>
<text x="410" y="405" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937">0.4000</text>
